<style>
:root {
  /* Mismo diseño que la web: paleta «Crimson, in balance» (#800E13), siempre en modo oscuro (28/11/2026) */
  --bg: #1E1516; --surface: #281C1D; --ink: #FAF7F7; --muted: #C9B5B6; --line: #3E2C2D;

}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-text); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; min-height: 100vh; }

h1, h2, h3 { font-family: var(--f-disp); line-height: 1.1; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
p { margin: 0; }
.cab { display: flex; align-items: center; justify-content: space-between; padding-block: 18px; }
.marca { display: flex; align-items: center; gap: 10px; font-family: var(--f-disp); font-weight: 900; font-size: 18px; text-decoration: none; color: inherit; }
.marca i { width: 32px; height: 32px; border-radius: 10px; background: var(--grad); display: grid; place-items: center; color: #fff; font-style: normal; font-size: 16px; }
.cab small { color: var(--muted); font-weight: 600; font-size: 14px; }

.barra div { height: 100%; width: 0; background: var(--grad); border-radius: 99px; transition: width .3s ease; }

@keyframes entra { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .paso { animation: none; } .barra div { transition: none; } }
.paso h2 { font-size: clamp(26px, 6.5vw, 34px); font-weight: 800; }
.paso .sub { color: var(--muted); margin: 8px 0 20px; }
.opciones { display: grid; gap: 10px; }
.opciones.dos { grid-template-columns: 1fr 1fr; }
.opciones.cinco { grid-template-columns: repeat(5, 1fr); }
.op { font: inherit; text-align: left; background: var(--surface); color: var(--ink); border: 2px solid var(--line); border-radius: 16px; padding: 14px 16px; font-weight: 600; cursor: pointer; display: flex; gap: 12px; align-items: center; min-width: 0; }
.op span.e { font-size: 22px; }
.op small { display: block; color: var(--muted); font-weight: 500; font-size: 13px; }
.opciones.cinco .op { justify-content: center; text-align: center; font-family: var(--f-disp); font-size: 20px; font-weight: 800; padding: 14px 0; }
.op[aria-pressed="true"] { border-color: #B97A7D; background: var(--soft); }
.op:hover { border-color: #5A4243; }
.op:focus-visible, .btn:focus-visible, input:focus-visible { outline: 3px solid var(--naranja); outline-offset: 2px; }
.campos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
.campo { display: grid; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 600; min-width: 0; }
input[type=text], input[type=tel], input[type=number] { font: inherit; font-size: 17px; color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; width: 100%; min-width: 0; }
.contacto { display: grid; gap: 12px; }
.tel-caja { display: flex; align-items: stretch; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; min-width: 0; }
.tel-caja:focus-within { border-color: #B97A7D; }
.tel-pref { position: relative; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-right: 2px solid var(--line); flex: none; font-size: 17px; font-weight: 700; color: var(--ink); }
.tel-pref svg { width: 12px; height: 12px; flex: none; }
.tel-pref select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 16px; }
.tel-pref:has(select:focus-visible) { outline: 3px solid var(--naranja); outline-offset: 2px; border-radius: 12px 0 0 12px; }
.tel-caja input[type=tel] { border: 0; background: transparent; border-radius: 0 14px 14px 0; flex: 1; }
.tel-caja input[type=tel]:focus-visible { outline: none; }
.permiso { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--muted); margin-top: 4px; }

.acciones { display: flex; gap: 10px; margin-top: 24px; }
.btn { font-family: var(--f-disp); font-weight: 800; font-size: 17px; border-radius: 999px; padding: 15px 22px; border: 0; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.prin { background: var(--rojo); color: #FAF7F7; flex: 1; box-shadow: 0 4px 12px rgba(128, 14, 19, .35); transition: background .15s ease; }
.btn.prin:not([disabled]):hover { background: #5A0A0D; box-shadow: 0 2px 8px rgba(90, 10, 13, .4); }
.btn.prin[disabled] { opacity: .45; box-shadow: none; cursor: default; }
.btn.sec { background: #FAF7F7; color: #1E1516; border: 0; }
.btn.sec:hover { background: #E6CFD0; }
.error { color: var(--error); font-size: 14px; font-weight: 600; margin-top: 12px; min-height: 1em; }
.cargando { text-align: center; padding: 60px 0; }
.rueda { width: 46px; height: 46px; margin: 0 auto 18px; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--violeta); animation: g .9s linear infinite; }
@keyframes g { to { transform: rotate(360deg); } }
.cargando p { color: var(--muted); }
.res-hero { background: var(--grad); color: #fff; border-radius: 24px; padding: 22px; }
.res-hero small { opacity: .9; font-weight: 600; }
.res-hero h2 { font-size: 28px; margin: 4px 0 14px; }
.cifras { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cifras div { background: rgba(255,255,255,.16); border-radius: 16px; padding: 12px 14px; font-size: 13px; }
.cifras b { display: block; font-family: var(--f-disp); font-size: 26px; font-weight: 800; }
.nota { font-size: 13px; color: var(--muted); margin: 10px 2px 0; }
.tarjeta { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; margin-top: 16px; }
.tarjeta h3 { font-size: 19px; }
.tarjeta .meta { color: var(--muted); font-size: 14px; margin: 2px 0 12px; }
.ej { display: grid; grid-template-columns: 30px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.ej:first-of-type { border-top: 0; }
.ej .n { width: 30px; height: 30px; border-radius: 50%; background: var(--soft); color: var(--violeta); display: grid; place-items: center; font-family: var(--f-disp); font-weight: 800; font-size: 14px; }
.ej b { font-family: var(--f-disp); }
.ej small { display: block; color: var(--muted); font-size: 13px; }
.ej p { font-size: 14px; margin-top: 2px; }
.lista-inc { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 15px; }
.plan-reco { border: 2px solid #B97A7D; box-shadow: 0 12px 30px rgba(128, 14, 19, .3); }
.reco-et { display: inline-block; margin: 0 0 10px; font-family: var(--f-disp); font-size: 14px; font-weight: 800; letter-spacing: .02em; text-transform: uppercase; color: #FAF7F7; background: var(--rojo); padding: 6px 16px; border-radius: 999px; }
.reco-cab { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.reco-cab h3 { margin: 0; }
.reco-precio { margin: 0; color: var(--muted); }
.reco-precio b { font-family: var(--f-disp); font-size: 28px; color: var(--ink); }
.otro { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.otro small { display: block; color: var(--muted); font-size: 13px; }
.otro span { font-weight: 700; white-space: nowrap; }
.lista-inc li::before { content: "✓ "; color: var(--ok); font-weight: 800; }
.final { display: grid; gap: 10px; margin-top: 18px; }
.cab-der { display: flex; align-items: center; gap: 10px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.idioma select { font: inherit; font-weight: 700; font-size: 13px; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 999px; padding: 4px 8px; min-height: 30px; cursor: pointer; }
.aviso-amigo { background: var(--soft); color: var(--violeta); border-radius: 14px; padding: 10px 14px; font-weight: 600; font-size: 14px; margin-bottom: 16px; }
@media (max-width: 420px) { .campos { grid-template-columns: 1fr 1fr; } .opciones.dos { grid-template-columns: 1fr; } }
</style>

<script>
var SERVIDOR = 'https://script.google.com/macros/s/AKfycbxoK5CtWp-VxVcLKB381XKj5cmmEpdNoK5os1zFFQd_FFPTUeZmptooGCfGiAjuO016xg/exec';
var FORMULARIO = 'https://docs.google.com/forms/d/e/1FAIpQLSfL1sSyGomZbEYxWkbrbjEIVHqMYTNbC_KUMqLSBntRvlw08g/viewform';
var CAMPO_AMIGO = 'entry.509349599';
// 28/11/2026: el mismo formulario en catalán e inglés (las respuestas pasan solas al original)
var FORMULARIO_IDIOMA = { ca: 'https://docs.google.com/forms/d/e/1FAIpQLSeW4MG0Th8a2h_ppaFUx4zUWbkN3qJdoDyQSjXEpi2ja3FBGg/viewform', en: 'https://docs.google.com/forms/d/e/1FAIpQLScSVbmBGKcsKGDr4Gg_6ap5Zvv-ferdiWkf2MDC0Aqatr3ZVg/viewform' };
var CAMPO_TEST = 'entry.1856085398', CAMPO_CODIGO = 'entry.1947545998';
var WHATSAPP = '34681193409';

var ref = String(new URLSearchParams(location.search).get('ref') || '').replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 40);
var R = { frena: [] }, paso = 0;
// Embudo: apunta (sin datos personales) hasta qué paso llega cada visita, una vez por paso.
var VISITA = Date.now().toString(36) + Math.random().toString(36).slice(2, 8), MARCADOS = {};
function marca(p) {
  if (MARCADOS[p]) return; MARCADOS[p] = 1;
  try { fetch(SERVIDOR, { method: 'POST', credentials: 'omit', keepalive: true, body: JSON.stringify({ fn: 'testPaso', args: ['', VISITA, p, ref ? 'amigo' : 'web'] }) }).catch(function () {}); } catch (e) {}
}
function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function $(s) { return document.querySelector(s); }

// Planes (propuesta del 25/11/2026, orientativa)
var PLANES = {
  'Esencial': { precio: '29 €', sub: 'Entreno y nutrición, con una revisión al mes', inc: ['Rutina y pautas de alimentación a medida', 'App con el vídeo de cada ejercicio y tu progreso', 'Revisión de tu plan cada 4 semanas', 'Chat para dudas, respuesta en 48 h'] },
  'Esencial · solo entreno': { precio: '15 €', sub: 'Tu entreno a medida, con una revisión al mes', inc: ['Rutina a medida', 'App con el vídeo de cada ejercicio y tu progreso', 'Revisión de tu plan cada 4 semanas', 'Chat para dudas, respuesta en 48 h'] },
  'Esencial · solo nutrición': { precio: '15 €', sub: 'Tus pautas de alimentación, con una revisión al mes', inc: ['Pautas de alimentación con opciones para elegir', 'Marca tus comidas en la app en un toque', 'Revisión de tu plan cada 4 semanas', 'Chat para dudas, respuesta en 48 h'] },
  'Completo': { precio: '49 €', sub: 'Entreno y nutrición, revisados contigo cada semana', inc: ['Rutina y pautas de alimentación a medida', 'Revisión cada domingo y ajustes según tu progreso', 'Chat con tu entrenador, respuesta en menos de 24 h', 'Videollamada de bienvenida de 20 minutos'] },
  'Premium': { precio: '79 €', sub: 'El trato más cercano, con videollamada cada 15 días', inc: ['Todo lo del plan Completo', 'Videollamada contigo cada 15 días', 'Chat prioritario: respuesta el mismo día'] }
};
function recomendar(acomp, necesita) {
  var r = { mes: 'Esencial', semana: 'Completo', cerca: 'Premium' }[acomp] || 'Completo';
  if (r === 'Esencial' && necesita === 'entreno') r = 'Esencial · solo entreno';
  if (r === 'Esencial' && necesita === 'nutricion') r = 'Esencial · solo nutrición';
  return r;
}
function enHorario() {
  try { var h = +new Intl.DateTimeFormat('es-ES', { timeZone: 'Europe/Madrid', hour: 'numeric', hourCycle: 'h23' }).format(new Date()); return h >= 7 && h < 22; } catch (e) { return true; }
}

var PASOS = [
  { t: '¿Qué quieres conseguir?', s: 'Elige lo que más te importa ahora mismo.', campo: 'objetivo', ops: [
    ['grasa', '🔥', 'Perder grasa', 'Bajar de peso y sentirme más ligero'],
    ['musculo', '💪', 'Ganar músculo', 'Más fuerza y más volumen'],
    ['ambos', '⚡', 'Las dos cosas', 'Perder grasa y ganar músculo'],
    ['rendimiento', '🏃', 'Rendir en mi deporte', 'Correr, jugar o competir mejor'],
    ['salud', '🌱', 'Salud y hábitos', 'Moverme más y comer mejor']] },
  { t: 'Cuéntanos un poco de ti', s: 'Lo usamos solo para calcular tu estimación.', tipo: 'datos' },
  { t: '¿Cuántos días puedes entrenar?', s: 'Sé realista: es mejor 3 días cumplidos que 5 a medias.', tipo: 'dias' },
  { t: '¿Dónde vas a entrenar?', s: 'Tu plan se adapta a lo que tengas.', campo: 'lugar', ops: [
    ['gimnasio', '🏋️', 'En el gimnasio', ''], ['casa', '🏠', 'En casa', 'Con poco material o ninguno'], ['fuera', '🌳', 'Al aire libre', 'Parque, pista o calle']] },
  { t: '¿Cuál es tu experiencia?', s: 'No hay respuesta mala: empezamos desde donde estés.', campo: 'nivel', ops: [
    ['cero', '🐣', 'Nunca he entrenado', ''], ['poco', '🙂', 'Algo, pero sin constancia', 'Menos de 6 meses'], ['medio', '💪', 'Entreno con regularidad', '6 meses a 2 años'], ['alto', '🔥', 'Llevo años entrenando', 'Más de 2 años']] },
  { t: '¿Qué te ha frenado hasta ahora?', s: 'Puedes marcar varias.', campo: 'frena', multi: true, ops: [

    ['Me cuesta la dieta', '🍕', 'Me cuesta la dieta', ''], ['Lesiones o molestias', '🩹', 'Lesiones o molestias', ''], ['Me falta motivación', '😴', 'Me falta motivación', '']] },
  { t: '¿Cómo quieres que te acompañe?', s: 'Así te recomendamos el plan que mejor te encaja.', campo: 'acomp', ops: [
    ['mes', '🧭', 'Me organizo solo', 'Quiero un buen plan y revisarlo una vez al mes'],
    ['semana', '📅', 'Que revisen mi progreso cada semana', 'Ajustes cada domingo y alguien pendiente'],

  { t: '¿Qué necesitas?', s: 'Elige una opción.', campo: 'necesita', ops: [
    ['entreno', '🏋️', 'Entreno', 'Rutina a medida con vídeos'], ['nutricion', '🥗', 'Nutrición', 'Pautas de alimentación con opciones'], ['ambos', '⚡', 'Los dos', 'Entreno y nutrición']] },
  { t: '¿A quién le enviamos tu resultado?', s: 'Te enseñamos tu estimación y tu primer entreno aquí mismo.', tipo: 'contacto' }
];

function pintar() {
  var p = PASOS[paso], h = '';
  marca('p' + (paso + 1));
  $('#barra').style.width = Math.round((paso + 1) / (PASOS.length + 1) * 100) + '%';
  $('#cuenta').textContent = t('Paso {n} de {total}').replace('{n}', paso + 1).replace('{total}', PASOS.length);
  if (paso === 0 && ref) h += '<div class="aviso-amigo">🎁 Vienes recomendado por un amigo.</div>';
  h += '<section class="paso on"><h2>' + p.t + '</h2><p class="sub">' + p.s + '</p>';
  if (p.ops) {
    h += '<div class="opciones">' + p.ops.map(function (o) {
      var on = p.multi ? R.frena.indexOf(o[0]) >= 0 : R[p.campo] === o[0];
      return '<button type="button" class="op" aria-pressed="' + on + '" data-v="' + esc(o[0]) + '"><span class="e">' + o[1] + '</span><span>' + o[2] + (o[3] ? '<small>' + o[3] + '</small>' : '') + '</span></button>';
    }).join('') + '</div>';
  } else if (p.tipo === 'datos') {

      '<div class="campo"><label for="tel">Tu WhatsApp</label><div class="tel-caja"><div class="tel-pref"><span id="pref-ver" data-no-tr>+' + esc(R.pref || '34') + '</span><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M1.5 3.5h9L6 9z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>' +

      '<input id="tel" type="tel" autocomplete="tel-national" inputmode="tel" maxlength="18" placeholder="' + ((R.pref || '34') === '34' ? '6xx xxx xxx' : t('Número')) + '" value="' + esc(R.tel || '') + '"></div></div>' +
      (+R.edad < 18 ? '<p class="nota" data-no-tr>' + t('Como tienes {edad} años, para empezar tu plan necesitaremos la autorización de tu padre, madre o tutor. Jan lo hablará contigo.').replace('{edad}', esc(R.edad)) + '</p>' : '') +

// Número completo con prefijo (+34600000000). Si lo escriben ya con + o 00, se respeta.
function telCompleto() {
  var t = String(R.tel || '').trim(), d = t.replace(/\D/g, '');
  if (/^\+/.test(t)) return '+' + d;
  if (/^00/.test(d)) return '+' + d.slice(2);
  var pf = R.pref || '34'; d = d.replace(/^0+/, '');
  if (d.indexOf(pf) === 0 && d.length - pf.length >= 9) d = d.slice(pf.length);
  return '+' + pf + d;
}
function guardarCampos() {
  ['edad', 'altura', 'peso', 'nombre', 'tel'].forEach(function (k) { var el = document.getElementById(k); if (el) R[k] = el.value.trim(); });
  var pf = document.getElementById('pref'); if (pf) { R.pref = pf.value; R.prefPais = PREFIJOS[pf.selectedIndex][0]; }
  var a = document.getElementById('acepto'); if (a) R.acepto = a.checked;
}
function validar() {
  var p = PASOS[paso];
  if (p.campo && !p.multi && !R[p.campo]) return 'Elige una opción para seguir.';
  if (p.tipo === 'datos') {
    if (!R.sexo) return 'Elige mujer u hombre.';
    var e = +R.edad, a = +R.altura, w = +String(R.peso).replace(',', '.');
    if (e >= 1 && e < 16) return 'De momento trabajamos con personas de 16 años o más. ¡Te esperamos cuando los cumplas! 💪';
    if (!(e >= 16 && e <= 90)) return 'Escribe tu edad.';
    if (!(a >= 130 && a <= 220)) return 'Escribe tu altura en centímetros (por ejemplo, 170).';
    if (!(w >= 35 && w <= 250)) return 'Escribe tu peso en kilos.';
  }
  if (p.tipo === 'dias' && !R.dias) return 'Elige cuántos días.';
  if (p.tipo === 'contacto') {
    if (!R.nombre) return 'Escribe tu nombre.';
    var tc = telCompleto().replace(/\D/g, '');
    if (/^34/.test(tc) ? !/^34[6-9]\d{8}$/.test(tc) : (tc.length < 8 || tc.length > 15)) return 'Escribe un WhatsApp válido.';
    if (!R.acepto) return 'Marca la casilla para que podamos escribirte.';
  }
  return '';
}
