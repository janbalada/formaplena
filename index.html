<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#800E13">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Forma Plena · Mis entrenos</title>
<!-- Icono y modo app al añadirla a la pantalla de inicio -->
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Forma Plena">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center; text-align: center;
    background: linear-gradient(135deg, #43070A, #800E13 55%, #9C4347); color: #fff;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; padding: 0 24px;
  }
  .marca { font-size: 13px; font-weight: 700; letter-spacing: .08em; opacity: .9; text-transform: uppercase; }
  .titulo { font-size: 26px; font-weight: 900; margin: 8px 0 22px; }
  .rueda { width: 40px; height: 40px; margin: 0 auto; border-radius: 50%;
    border: 4px solid rgba(255,255,255,.35); border-top-color: #fff; animation: g .9s linear infinite; }
  @keyframes g { to { transform: rotate(360deg); } }
  .texto { margin-top: 16px; font-size: 15px; opacity: .95; line-height: 1.45; }
  .pegar { margin-top: 18px; display: grid; gap: 10px; max-width: 340px; margin-inline: auto; }
  .pegar input { font: inherit; font-size: 16px; padding: 13px 14px; border-radius: 12px; border: 0; color: #17122B; }
  .pegar button { margin-top: 0; }
  button { margin-top: 20px; background: #fff; color: #800E13; border: 0; border-radius: 14px;
    font: inherit; font-weight: 800; font-size: 17px; padding: 14px 26px; }
</style>
</head>
<body>
<div>
  <div class="marca">Forma Plena Coaching</div>
  <div class="titulo">Mis entrenos</div>
  <div class="rueda" id="rueda"></div>
  <div class="texto" id="texto">Cargando tu app…</div>
</div>
<script>
(function () {
  // Servidor de la app (Google Apps Script). Se le habla sin cookies para que
  // funcione aunque el móvil tenga varias cuentas de Google abiertas.
  var SERVIDOR = 'https://script.google.com/macros/s/AKfycbxoK5CtWp-VxVcLKB381XKj5cmmEpdNoK5os1zFFQd_FFPTUeZmptooGCfGiAjuO016xg/exec';

  var texto = document.getElementById('texto'), rueda = document.getElementById('rueda');
  var IOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  function limpiar(t) { return String(t || '').replace(/[^a-zA-Z0-9]/g, ''); }
  function leer() { try { return limpiar(localStorage.getItem('fp_k')); } catch (e) { return ''; } }
  function guardar(v) { try { localStorage.setItem('fp_k', v); } catch (e) {} }

  // El enlace personal de cada cliente lleva su código (?k=...). Se guarda en el móvil para que,
  // al abrir la app desde el icono de la pantalla de inicio, entre directo a lo suyo.
  var k = limpiar(new URLSearchParams(location.search).get('k'));
  if (k) guardar(k); else k = leer();

  // En Android el «archivo de la app» (manifest) da el icono y la pantalla completa.
  // En iPhone no se usa: así el icono abre siempre el enlace personal con el que se añadió.
  if (!IOS) { var lm = document.createElement('link'); lm.rel = 'manifest'; lm.href = 'manifest.webmanifest'; document.head.appendChild(lm); }
  var CABECERA = '<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">' +
    '<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">' +
    '<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">' +
    '<meta name="apple-mobile-web-app-title" content="Forma Plena"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">' +
    (IOS ? '' : '<link rel="manifest" href="manifest.webmanifest">');

  function pedirEnlace() {
    rueda.style.display = 'none';
    texto.textContent = 'Pega aquí el enlace de tu app (el que te envió tu entrenador) para entrar. Solo tendrás que hacerlo una vez.';
    var f = document.createElement('form'); f.className = 'pegar';
    f.innerHTML = '<input id="enlace" type="url" inputmode="url" autocomplete="off" placeholder="https://janbalada.github.io/formaplena/?k=…" aria-label="Enlace de tu app"><button type="submit">Entrar</button>';
    f.onsubmit = function (ev) {
      ev.preventDefault();
      var v = document.getElementById('enlace').value, m = v.match(/[?&]k=([a-zA-Z0-9]+)/), c = limpiar(m ? m[1] : v);
      if (c.length < 16) { texto.textContent = 'Ese enlace no parece correcto. Cópialo entero desde el email de tu entrenador.'; return; }
      guardar(c); location.href = location.pathname + '?k=' + c;
    };
    texto.parentNode.appendChild(f);
  }

  function error(msg, reintentar) {
    rueda.style.display = 'none';
    texto.textContent = msg;
    if (reintentar) {
      var b = document.createElement('button');
      b.textContent = 'Reintentar';
      b.onclick = function () { location.reload(); };
      texto.parentNode.appendChild(b);
    }
  }

  if (!k) { pedirEnlace(); return; }

  // Guarda la puerta de la app en el móvil para abrir rápido y sin conexión.
  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {} }

  var lento = setTimeout(function () { texto.textContent = 'Un momento, ya casi está…'; }, 6000);
  var CLAVE_HTML = 'fp_html_' + k, guardada = '';
  try { guardada = localStorage.getItem(CLAVE_HTML) || ''; } catch (e) {}

  function mostrar(html) {
    // Se mantienen el icono y el modo app también dentro de la app ya cargada.
    html = /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, function (h) { return h + CABECERA; }) : CABECERA + html;
    document.open();
    document.write(html);
    document.close();
  }

  // Siempre se pide la versión nueva y se guarda para la próxima vez.
  var nueva = fetch(SERVIDOR + '?html=1&k=' + encodeURIComponent(k), { credentials: 'omit', redirect: 'follow', cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function (html) {
      if (html.indexOf('<html') < 0) throw new Error('Respuesta inesperada');
      try { localStorage.setItem(CLAVE_HTML, html); } catch (e) {}
      return html;
    });

  // Si ya había una guardada, la app se abre al instante con ella (también sin conexión).
  if (guardada.indexOf('<html') >= 0) {
    clearTimeout(lento); nueva.catch(function () {});
    // Se espera a que esta página termine de cargar: así la app la sustituye entera (si no, queda debajo de «Cargando…»).
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(function () { mostrar(guardada); }, 0); });
    else setTimeout(function () { mostrar(guardada); }, 0);
    return;
  }

  nueva.then(function (html) { clearTimeout(lento); mostrar(html); })
    .catch(function () {
      clearTimeout(lento);
      error('No se ha podido cargar tu app. Revisa tu conexión a internet y vuelve a intentarlo.', true);
    });
})();
</script>
</body>
</html>
