<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#43070A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FP Coach">
<title>Forma Plena Coach</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #43070A; overflow: hidden; }
  #panel { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #F7F3F4;
    padding-top: env(safe-area-inset-top, 0px); box-sizing: border-box; }
  #carga { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: linear-gradient(135deg,#43070A 0%,#6E1430 55%,#9E2A45 100%); color: #fff; font: 600 16px/1.4 Inter, -apple-system, Roboto, sans-serif; transition: opacity .4s; }
  #carga img { width: 84px; height: 84px; border-radius: 22px; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
  #carga a { color: #fff; opacity: .85; font-size: 14px; }
  #carga.fuera { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<!-- App del entrenador. Solo abre el panel privado: Google sigue pidiendo la cuenta de Jan. -->
<div id="carga"><img src="icons/icono-192.png" alt=""><div>Abriendo tu panel…</div>
  <a id="directo" href="https://script.google.com/macros/s/AKfycbyY-EPhRrRPPVe6RZXIrJFvWr2dRw9IEZwRw4BaYTvlvtgukzPtNIixUu4Bt3JSSx-k/exec" target="_top" hidden>¿No carga? Ábrelo aquí</a></div>
<iframe id="panel" title="Forma Plena Coach" allow="microphone; clipboard-write"
  src="https://script.google.com/macros/s/AKfycbyY-EPhRrRPPVe6RZXIrJFvWr2dRw9IEZwRw4BaYTvlvtgukzPtNIixUu4Bt3JSSx-k/exec"></iframe>
<script>
  var f = document.getElementById('panel'), c = document.getElementById('carga');
  f.addEventListener('load', function () { setTimeout(function () { c.classList.add('fuera'); }, 300); });
  setTimeout(function () { document.getElementById('directo').hidden = false; }, 9000);
  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function () {}); } catch (e) {} }
</script>
</body>
</html>
